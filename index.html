<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Rishika ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Outfit:wght@300;400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a0e;
            --bg-surface: #121218;
            --accent-periwinkle: #7c8cfd;
            --accent-gold: #d4a853;
            --accent-rose: #f87171;
            --accent-teal: #34d399;
            --accent-lavender: #c4b5fd;
            --text-primary: #eae8f2;
            --text-muted: #8a87a0;
            --glass-bg: rgba(255, 255, 255, 0.025);
            --glass-border: rgba(255, 255, 255, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ========== OPENING ANIMATION OVERLAY ========== */
        #openingOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-deep);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease, visibility 1.5s ease;
        }

        #openingOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .opening-gift {
            font-size: 100px;
            cursor: pointer;
            animation: giftBounce 2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(124, 140, 253, 0.4));
            transition: transform 0.3s ease;
            user-select: none;
        }

        .opening-gift:hover {
            transform: scale(1.15);
        }

        .opening-gift.shaking {
            animation: giftShake 0.5s ease-in-out;
        }

        @keyframes giftBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes giftShake {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-15deg); }
            40% { transform: rotate(15deg); }
            60% { transform: rotate(-10deg); }
            80% { transform: rotate(10deg); }
        }

        .opening-text {
            margin-top: 30px;
            font-family: 'Cinzel', serif;
            font-size: 18px;
            letter-spacing: 4px;
            color: var(--accent-periwinkle);
            animation: pulseText 2s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .opening-sparkles {
            position: absolute;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .opening-sparkle {
            position: absolute;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--accent-gold);
            animation: openingSparkle 2s ease-out forwards;
        }

        @keyframes openingSparkle {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Gift explosion particles */
        .gift-particle {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 1001;
            animation: giftParticleFly 1.5s ease-out forwards;
        }

        @keyframes giftParticleFly {
            0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(var(--rot)); }
        }

        /* Background Canvas */
        #bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Fireworks Canvas */
        #fireworksCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Floating Balloons */
        .balloon-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            bottom: -120px;
            width: 50px; height: 65px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            opacity: 0.7;
            animation: balloonFloat linear infinite;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: 50%;
            width: 1px; height: 30px;
            background: rgba(255,255,255,0.3);
            transform: translateX(-50%);
        }

        .balloon::before {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            width: 8px; height: 6px;
            background: inherit;
            border-radius: 50%;
            transform: translateX(-50%);
        }

        @keyframes balloonFloat {
            0% { transform: translateY(0) rotate(-5deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-110vh) rotate(5deg); opacity: 0; }
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 8px; height: 8px;
            top: -10px;
            animation: confettiFall linear infinite;
        }

        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* Sparkle Trail */
        .sparkle {
            position: fixed;
            width: 4px; height: 4px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            animation: sparkleFade 1s ease-out forwards;
        }

        @keyframes sparkleFade {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 5;
            max-width: 850px;
            margin: 0 auto;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Glass Card */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 55px 45px;
            width: 100%;
            text-align: center;
            box-shadow: 
                0 12px 48px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            animation: cardReveal 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -60%; left: -60%;
            width: 220%; height: 220%;
            background: 
                radial-gradient(circle at 25% 25%, rgba(124, 140, 253, 0.06), transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(212, 168, 83, 0.04), transparent 50%);
            animation: slowRotate 25s linear infinite;
            pointer-events: none;
        }

        @keyframes slowRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes cardReveal {
            0% { opacity: 0; transform: translateY(50px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Decorative Elements */
        .deco-star {
            position: absolute;
            color: var(--accent-gold);
            font-size: 16px;
            animation: starTwinkle 3s ease-in-out infinite;
        }

        .deco-star:nth-child(1) { top: 25px; left: 35px; animation-delay: 0s; }
        .deco-star:nth-child(2) { top: 45px; right: 45px; animation-delay: 0.7s; }
        .deco-star:nth-child(3) { bottom: 35px; left: 55px; animation-delay: 1.4s; }
        .deco-star:nth-child(4) { bottom: 55px; right: 35px; animation-delay: 2.1s; }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.25; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        /* Cake Animation */
        .cake-wrapper {
            margin-bottom: 25px;
            animation: cakeBounce 2s ease-out 0.3s both;
        }

        .cake {
            font-size: 70px;
            display: inline-block;
            animation: cakeWobble 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(212, 168, 83, 0.3));
        }

        @keyframes cakeBounce {
            0% { opacity: 0; transform: translateY(-30px) scale(0.5); }
            60% { transform: translateY(10px) scale(1.1); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes cakeWobble {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        /* Candle Flames */
        .flame {
            display: inline-block;
            font-size: 18px;
            animation: flameFlicker 0.5s ease-in-out infinite alternate;
        }

        @keyframes flameFlicker {
            0% { transform: scaleY(1) scaleX(1); opacity: 0.9; }
            100% { transform: scaleY(1.2) scaleX(0.9); opacity: 1; }
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(124, 140, 253, 0.08);
            border: 1px solid rgba(124, 140, 253, 0.2);
            border-radius: 50px;
            padding: 9px 22px;
            margin-bottom: 22px;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-periwinkle);
            animation: slideDown 1.5s ease-out 0.8s both;
        }

        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-25px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Name */
        .name {
            font-family: 'Cinzel', serif;
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-periwinkle), var(--accent-gold), var(--accent-rose), var(--accent-periwinkle));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 6s ease infinite, nameReveal 2s ease-out 1s both;
            letter-spacing: 6px;
            margin-bottom: 8px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes nameReveal {
            0% { opacity: 0; letter-spacing: 25px; transform: scale(0.75); }
            100% { opacity: 1; letter-spacing: 6px; transform: scale(1); }
        }

        /* Subtitle */
        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 35px;
            animation: fadeUp 1.8s ease-out 1.4s both;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Divider */
        .divider {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-periwinkle), var(--accent-gold), transparent);
            margin: 0 auto 35px;
            animation: dividerExpand 1.5s ease-out 1.7s both;
        }

        @keyframes dividerExpand {
            0% { width: 0; opacity: 0; }
            100% { width: 100px; opacity: 1; }
        }

        /* Poetry Section */
        .poetry {
            max-width: 620px;
            margin: 0 auto 30px;
            animation: fadeUp 2s ease-out 2s both;
        }

        .poem-stanza {
            margin-bottom: 28px;
            line-height: 2.2;
        }

        .poem-stanza:last-child {
            margin-bottom: 0;
        }

        .poem-line {
            font-size: 17px;
            font-weight: 300;
            color: var(--text-primary);
            opacity: 0;
            animation: lineReveal 1s ease-out forwards;
        }

        .poem-line.highlight {
            color: var(--accent-periwinkle);
            font-weight: 500;
        }

        .poem-line.gold {
            color: var(--accent-gold);
            font-style: italic;
        }

        .poem-line.rose {
            color: var(--accent-rose);
            font-weight: 400;
        }

        @keyframes lineReveal {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Connection Box */
        .connection-box {
            background: rgba(124, 140, 253, 0.04);
            border: 1px solid rgba(124, 140, 253, 0.12);
            border-radius: 20px;
            padding: 30px 35px;
            margin: 25px 0;
            animation: fadeUp 2s ease-out 5s both;
            position: relative;
        }

        .connection-box::before {
            content: '✦';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-surface);
            padding: 0 15px;
            color: var(--accent-gold);
            font-size: 18px;
        }

        .connection-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 4px;
            color: var(--accent-gold);
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .connection-text {
            font-size: 15px;
            line-height: 2;
            color: var(--text-muted);
            font-weight: 300;
        }

        .connection-text strong {
            color: var(--accent-periwinkle);
            font-weight: 500;
        }

        /* Signature Quote */
        .signature-quote {
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            color: var(--accent-lavender);
            margin: 35px 0;
            animation: fadeUp 2s ease-out 6s both;
            line-height: 1.6;
            position: relative;
        }

        .signature-quote::before,
        .signature-quote::after {
            content: '❝';
            font-size: 30px;
            color: var(--accent-gold);
            opacity: 0.3;
            position: absolute;
        }

        .signature-quote::before {
            top: -15px;
            left: -20px;
        }

        .signature-quote::after {
            content: '❞';
            bottom: -20px;
            right: -20px;
        }

        /* From Section */
        .from-section {
            margin-top: 35px;
            animation: fadeUp 2s ease-out 6.5s both;
        }

        .from-label {
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .from-name {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: var(--accent-periwinkle);
            letter-spacing: 4px;
        }

        .heart-pulse {
            display: inline-block;
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(25px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Click to celebrate button */
        .celebrate-btn {
            margin-top: 30px;
            padding: 14px 36px;
            background: linear-gradient(135deg, rgba(124, 140, 253, 0.15), rgba(212, 168, 83, 0.1));
            border: 1px solid rgba(124, 140, 253, 0.25);
            border-radius: 50px;
            color: var(--accent-periwinkle);
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            animation: fadeUp 2s ease-out 7s both;
            position: relative;
            overflow: hidden;
        }

        .celebrate-btn:hover {
            background: linear-gradient(135deg, rgba(124, 140, 253, 0.25), rgba(212, 168, 83, 0.2));
            border-color: rgba(124, 140, 253, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 140, 253, 0.2);
        }

        .celebrate-btn:active {
            transform: translateY(0);
        }

        /* ========== GAME SECTION ========== */
        .game-section {
            margin-top: 50px;
            width: 100%;
            animation: fadeUp 2s ease-out 7.5s both;
        }

        .game-title {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: var(--accent-gold);
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .game-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-weight: 300;
        }

        .game-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        /* Memory Match Game */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .memory-card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(124, 140, 253, 0.1), rgba(18, 18, 24, 0.8));
            border: 1px solid rgba(124, 140, 253, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            transform-style: preserve-3d;
            user-select: none;
        }

        .memory-card:hover:not(.flipped):not(.matched) {
            border-color: rgba(124, 140, 253, 0.4);
            box-shadow: 0 0 20px rgba(124, 140, 253, 0.15);
